name: Pages

# Builds the static project page in website/ and deploys it to GitHub Pages.
# The page's numbers come from bench/results/latest.json (the accepted
# scoreboard run); website/build_data.py turns that into website/results.json.
# No benchmarks run here: the scoreboard is produced and gated elsewhere.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "bench/results/latest.json"
      - "bench/scoreboard.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build results.json from the accepted scoreboard run
        run: python website/build_data.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "website"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
