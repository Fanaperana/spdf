[package]
name = "spdf-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "spdf command-line interface."

[[bin]]
name = "spdf"
path = "src/main.rs"

[dependencies]
spdf-core.workspace = true
spdf-types.workspace = true
spdf-output.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", features = ["extended"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["neural-ocr"]
# Built-in GPU neural OCR for scanned pages (no system install needed).
neural-ocr = ["spdf-core/neural-ocr"]
# Also allow SPDF_OCR_DEVICE=cuda for the neural OCR engine.
neural-ocr-cuda = ["spdf-core/neural-ocr-cuda"]
# Enable Tesseract-backed local OCR. Requires system libtesseract +
# libleptonica (e.g. `apt install libtesseract-dev libleptonica-dev`).
tesseract = ["spdf-core/tesseract"]
