[package]
name = "spdf-ocr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "OCR engine trait + built-in neural (Burn), HTTP and Tesseract implementations."

[dependencies]
spdf-types.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tesseract = { workspace = true, optional = true }
burn = { version = "0.22", default-features = false, features = ["std", "wgpu", "flex", "simd", "rayon"], optional = true }
burn-store = { version = "0.22", optional = true }
burn-flex = { version = "0.22", default-features = false, features = ["std"], optional = true }
image = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

[build-dependencies]
burn-onnx = { version = "0.22", optional = true }
onnx-ir = { version = "0.22", optional = true }
ureq = { version = "2.12", features = ["tls"], optional = true }
sha2 = { version = "0.10", optional = true }

[features]
default = ["http"]
http = ["dep:reqwest", "dep:tokio"]
tesseract = ["dep:tesseract"]
# Built-in neural OCR (PP-OCRv5 det + rec compiled to Burn, GPU via wgpu with
# CPU fallback). Model weights are fetched + SHA-256-verified at build time
# and embedded in the binary.
neural = ["dep:burn", "dep:burn-store", "dep:burn-flex", "dep:image", "dep:rayon", "dep:burn-onnx", "dep:onnx-ir", "dep:ureq", "dep:sha2"]
# Additionally allow `SPDF_OCR_DEVICE=cuda` (needs the CUDA driver).
neural-cuda = ["neural", "burn/cuda"]
